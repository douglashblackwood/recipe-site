<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex"><title>This Week · Blackwood Kitchen</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" defer></script></head>
<body><div class="wrap">
<a class="back" href="index.html">&larr; All recipes</a>
<div class="rhead"><div class="icon" style="--cat:var(--accent)"><iconify-icon icon="ph:calendar-heart"></iconify-icon></div>
<h1>This Week</h1>
<p class="intro" id="range">The week's dinner plan, straight from the meal planner.</p></div>

<div class="panel" style="max-width:640px; margin-top:22px">
<p id="status" class="count" style="margin:0">Loading the plan&hellip;</p>
<ul class="plan" id="plan"></ul>
</div>

<footer>Part of the <a href="index.html">household cookbook</a> &middot; the plan updates when a new week is published</footer>
</div>
<script>
const FEED='https://gist.githubusercontent.com/douglashblackwood/bea2fc791caba3d88676cd19f4b5c182/raw/plan.json';
const status=document.getElementById('status'),list=document.getElementById('plan'),range=document.getElementById('range');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
fetch(FEED,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(p=>{
  const start=parse(p.week_of),today=iso(new Date());
  const end=new Date(start);end.setDate(end.getDate()+6);
  const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  range.textContent='Week of '+start.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+' to '+end.toLocaleDateString('en-GB',{day:'numeric',month:'long'})+'.';
  if(!p.days||!p.days.length){status.textContent='No plan published for this week yet.';return}
  const byDate={};p.days.forEach(d=>byDate[d.date]=d);
  status.remove();
  for(let i=0;i<7;i++){
    const d=new Date(start);d.setDate(d.getDate()+i);
    const key=iso(d),m=byDate[key],li=document.createElement('li');
    if(key===today)li.classList.add('today');
    const day=document.createElement('span');day.className='d';
    day.innerHTML=d.toLocaleDateString('en-GB',{weekday:'short'})+'<small>'+fmt(d)+'</small>';
    li.appendChild(day);
    if(m&&m.meal){
      if(m.href){const a=document.createElement('a');a.href=m.href;a.textContent=m.meal;li.appendChild(a)}
      else{const s=document.createElement('span');s.className='meal';s.textContent=m.meal;li.appendChild(s)}
    }else{const s=document.createElement('span');s.className='none';s.textContent='–';li.appendChild(s)}
    list.appendChild(li);
  }
}).catch(e=>{status.textContent='Couldn’t load the plan feed ('+e.message+'). Check the connection and reload.'});
</script>
</body></html>
